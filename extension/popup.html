<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 300px;
            min-height: 200px; /* Aggiunge altezza minima per la vista di conferma */
            padding: 20px;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            text-align: center;
            background-color: #ffffff;
            color: #334155;
            margin: 0;
        }
        #confirmation-view {
            display: none; /* Nascosto di default */
            text-align: left;
        }
        .header {
            margin-bottom: 20px;
        }
        h3 {
            margin: 0;
            color: #0f172a;
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        h4 {
            font-size: 15px;
            color: #1e293b;
            margin: 0 0 10px 0;
        }
        .subtitle {
            font-size: 13px;
            color: #64748b;
            margin: 4px 0 0 0;
        }
        button {
            border: none;
            padding: 12px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            width: 100%;
            transition: all 0.2s ease;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        #micBtn, #rewriteBtn, #rewriteSelectedBtn {
            background-color: #dc2626;
            color: white;
            box-shadow: 0 2px 4px rgba(220, 38, 38, 0.2);
        }
        #micBtn:hover:not(:disabled), #rewriteBtn:hover:not(:disabled), #rewriteSelectedBtn:hover:not(:disabled) {
            background-color: #b91c1c;
            transform: translateY(-1px);
        }
        .confirmation-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        #confirm-rewrite-btn {
            background-color: #16a34a; /* Verde */
            color: white;
        }
        #cancel-rewrite-btn {
            background-color: #64748b; /* Grigio */
            color: white;
        }
        #confirm-rewrite-btn:hover:not(:disabled) { background-color: #15803d; }
        #cancel-rewrite-btn:hover:not(:disabled) { background-color: #475569; }
        button:disabled {
            background-color: #e2e8f0 !important;
            color: #94a3b8 !important;
            cursor: not-allowed;
            box-shadow: none !important;
            transform: none !important;
            border-color: transparent !important;
        }
        #suggestion-textarea {
            width: 100%;
            box-sizing: border-box;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            padding: 8px;
            font-family: inherit;
            font-size: 13px;
            resize: vertical;
            min-height: 120px;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            box-sizing: border-box;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            padding: 10px;
            margin-bottom: 12px;
            font-family: inherit;
            font-size: 13px;
        }
        #loginBtn {
            background-color: #2563eb;
            color: white;
        }
        #loginBtn:hover { background-color: #1d4ed8; }
        #logoutBtn {
            background-color: #e2e8f0;
            color: #475569;
            margin-top: 15px;
            padding: 8px;
            font-size: 12px;
        }
        #logoutBtn:hover { background-color: #cbd5e1; }
        #login-view { display: none; }
        #status {
            font-size: 13px;
            color: #475569;
            padding: 12px;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 15px;
            box-sizing: border-box;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div id="login-view">
        <div class="header">
            <h3>🔒 Login Assistant</h3>
            <p class="subtitle">Inserisci le tue credenziali</p>
        </div>
        <input type="text" id="usernameInput" placeholder="Username">
        <input type="password" id="passwordInput" placeholder="Password">
        <button id="loginBtn">Accedi</button>
        <div id="loginError" style="color: #dc2626; font-size: 13px; margin-top: 10px; display: none;"></div>
    </div>

    <div id="main-view" style="display: none;">
        <div class="header">
            <h3>✨ CRM AI Assistant</h3>
            <p class="subtitle">Automatizza la compilazione dei ticket</p>
        </div>
        
        <button id="micBtn">🎙️ Clicca e Parla</button>
        <button id="rewriteBtn">✍️ Usa testo in Descrizione</button>
        <button id="rewriteSelectedBtn">📝 Migliora Testo Selezionato</button>
        <button id="logoutBtn">🚪 Esci</button>
        <div id="status">Pronto all'uso.</div>
        
        
    </div>

    <div id="confirmation-view">
        <h4>Verifica e modifica il testo suggerito:</h4>
        <textarea id="suggestion-textarea"></textarea>
        <div class="confirmation-buttons">
            <button id="confirm-rewrite-btn">✅ Conferma</button>
            <button id="cancel-rewrite-btn">❌ Annulla</button>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
